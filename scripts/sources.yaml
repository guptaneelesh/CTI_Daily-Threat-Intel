# Open-source CTI feeds. Add/remove freely.
# `type`: rss | atom | nvd | cisa_kev
# `trust`: 1-5, used as a tiebreaker for dedup (higher wins)
# `category`: threat | vuln | advisory | breach | mixed

feeds:
  # ---------------- News / Blogs ----------------
  - name: BleepingComputer
    url: https://www.bleepingcomputer.com/feed/
    type: rss
    trust: 4
    category: mixed

  - name: The Hacker News
    url: https://feeds.feedburner.com/TheHackersNews
    type: rss
    trust: 4
    category: mixed

  - name: GBHackers
    url: https://gbhackers.com/feed/
    type: rss
    trust: 3
    category: mixed

  - name: Krebs on Security
    url: https://krebsonsecurity.com/feed/
    type: rss
    trust: 5
    category: mixed

  - name: SecurityWeek
    url: https://www.securityweek.com/feed/
    type: rss
    trust: 4
    category: mixed

  - name: The Record
    url: https://therecord.media/feed/
    type: rss
    trust: 4
    category: mixed

  - name: Dark Reading
    url: https://www.darkreading.com/rss.xml
    type: rss
    trust: 4
    category: mixed

  # ---------------- Vendor Threat Intel ----------------
  - name: Unit 42 (Palo Alto)
    url: https://unit42.paloaltonetworks.com/feed/
    type: rss
    trust: 5
    category: threat

  - name: Microsoft Security Blog
    url: https://www.microsoft.com/en-us/security/blog/feed/
    type: rss
    trust: 5
    category: threat

  - name: Microsoft MSRC
    url: https://msrc.microsoft.com/blog/feed
    type: rss
    trust: 5
