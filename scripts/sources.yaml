  - name: Google TAG / Mandiant
    url: https://cloud.google.com/blog/topics/threat-intelligence/rss
    type: rss
    trust: 5
    category: threat

  - name: Cisco Talos
    url: https://blog.talosintelligence.com/rss/
    type: rss
    trust: 5
    category: threat

  - name: CrowdStrike Blog
    url: https://www.crowdstrike.com/blog/feed
    type: rss
    trust: 5
    category: threat

  - name: SentinelOne Labs
    url: https://www.sentinelone.com/labs/feed/
    type: rss
    trust: 4
    category: threat

  - name: Trend Micro Research
    url: https://www.trendmicro.com/en_us/research.xml.rss.xml
    type: rss
    trust: 4
    category: threat

  - name: Securelist (Kaspersky)
    url: https://securelist.com/feed/
    type: rss
    trust: 4
    category: threat

  - name: Check Point Research
    url: https://research.checkpoint.com/feed/
    type: rss
    trust: 4
    category: threat

  # ---------------- Government / CERT ----------------
  - name: CISA Alerts
    url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    type: rss
    trust: 5
    category: advisory

  - name: CISA Known Exploited Vulns
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    type: cisa_kev
    trust: 5
    category: vuln

  - name: US-CERT Current Activity
    url: https://www.cisa.gov/news-events/news.xml
    type: rss
    trust: 5
    category: advisory

  # ---------------- Vulnerability Sources ----------------
  - name: NVD Recent CVEs
    url: https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=50
    type: nvd
    trust: 5
    category: vuln

